services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: telegram_dev_only
      POSTGRES_DB: telegram
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d telegram"]
      interval: 5s
      timeout: 5s
      retries: 10
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: telegram_test_only
      POSTGRES_DB: telegram_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d telegram_test"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
